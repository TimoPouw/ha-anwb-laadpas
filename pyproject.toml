[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["tools/sample_response.json"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "D"]
ignore = [
  "D203", "D213", "E501",
  "PLR0911", "PLR0912", "PLR0913", "PLR2004",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "PLC0415"]
"tools/**" = ["D", "T201", "PLC0415"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
